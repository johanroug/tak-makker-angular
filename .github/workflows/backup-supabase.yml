name: Backup Supabase to Simply

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-backup
  cancel-in-progress: false

jobs:
  backup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: simply-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.20.0'
      - name: Install pinned backup CLI
        run: npm install --prefix "$RUNNER_TEMP/backup-cli" --no-package-lock --no-save supabase@2.118.0
      - name: Check backup retention safeguards
        run: bash scripts/check-backup-retention.sh
      - name: Encrypt and upload database backup
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          BACKUP_ENCRYPTION_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}
          SIMPLY_SSH_USER: ${{ secrets.SIMPLY_SSH_USER }}
          SIMPLY_SSH_PRIVATE_KEY: ${{ secrets.SIMPLY_SSH_PRIVATE_KEY }}
          SIMPLY_SSH_KNOWN_HOSTS: ${{ secrets.SIMPLY_SSH_KNOWN_HOSTS }}
        run: |
          export PATH="$RUNNER_TEMP/backup-cli/node_modules/.bin:$PATH"
          bash scripts/backup-supabase.sh
