<div class="min-h-screen bg-stone-50">
  <div class="mx-auto max-w-[1440px] px-6 py-5">
    <!-- Header -->
    <header class="app-header">
      <a routerLink="/projects" class="app-logo"> Tak Makker </a>

      <div class="header-actions">
        <select
          class="project-selector"
          [value]="project()?.project?.id ?? ''"
          (change)="selectProject($any($event.target).value)"
        >
          <option value="" disabled>Vælg projekt</option>

          @for (item of projects(); track item.id) {
            <option [value]="item.id">
              {{ item.project_number }} ·
              {{ item.title || 'Projekt uden titel' }}
            </option>
          }
        </select>

        <button type="button" class="new-project-button" disabled>+ Nyt projekt</button>
      </div>

      <a routerLink="/company-profile" class="profile-button"> Virksomhedsprofil </a>
    </header>

    @if (isLoading()) {
      <p>Henter projekt...</p>
    } @else if (errorMessage()) {
      <p>{{ errorMessage() }}</p>
    } @else if (project(); as data) {
      <!-- Hovedlayout -->
      <main class="project-layout">
        <!-- Venstre kolonne -->
        <app-offer-preview [data]="data" />

        <!-- Højre kolonne -->
        <app-project-sidebar [data]="data" />
      </main>
    } @else {
      <main class="empty-workspace">
        <h1>Velkommen til Tak Makker</h1>

        <p>Vælg et eksisterende projekt ovenfor, eller opret et nyt projekt.</p>
      </main>
    }
  </div>
</div>
