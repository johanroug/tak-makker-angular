<div class="min-h-screen bg-stone-50">
  <div class="mx-auto max-w-[1440px] px-6 py-5">
    <!-- Header -->
    <header class="app-header">
      <div>
        <a routerLink="/projects" class="app-logo"> Tak Makker </a>
      </div>

      <div class="header-actions">
        <select
          class="project-selector"
          [formControl]="projectControl"
          (change)="selectProject(projectControl.value)"
        >
          <option value="" disabled>Vælg projekt</option>

          @for (item of projects(); track item.id) {
            <option [value]="item.id">
              {{ item.project_number }} ·
              {{ item.title || 'Projekt uden titel' }}
            </option>
          }
        </select>

        <button
          type="button"
          class="new-project-button"
          (click)="createProject()"
        >
          + Nyt projekt
        </button>
      </div>

      <div class="account-actions">
        <a routerLink="/company-profile" class="profile-button"> Virksomhedsprofil </a>

        <button type="button" class="logout-button" (click)="logout()">Log ud</button>
      </div>
    </header>

    @if (isLoading()) {
      <p>Henter projekt...</p>
    } @else if (errorMessage()) {
      <p>{{ errorMessage() }}</p>
    } @else if (project(); as data) {
      <!-- Hovedlayout -->
      <main class="project-layout">
        <!-- Venstre kolonne -->
        
        <app-offer-preview
          [data]="projectSidebar.getPreviewData(data)"
          [hasPendingChanges]="projectSidebar.hasPendingChanges(data) || projectSidebar.pendingSaves() > 0"
          [isSavingChanges]="projectSidebar.pendingSaves() > 0"
          [openDetailsInitially]="newProjectId() === data.project.id"
          (detailsOpened)="onDetailsOpened()"
          (detailsSaved)="onDetailsSaved()"
          (offerFinalized)="onOfferFinalized()"
          (requestTab)="projectSidebar.selectTab($event)"
        />

        <!-- Højre kolonne -->
        <app-project-sidebar #projectSidebar [data]="data" (messageAdded)="refreshProject()" />
      </main>
    } @else {
      <main class="empty-workspace">
        <h1>Velkommen til Tak Makker</h1>

        <p>Vælg et eksisterende projekt ovenfor, eller opret et nyt projekt.</p>
      </main>
    }
  </div>
</div>

<app-new-project-dialog (projectCreated)="loadProjects()" />
