<div class="min-h-screen bg-stone-50">
  <div class="project-shell mx-auto max-w-[1440px] px-6 py-5">
    @if (refreshError()) {
      <p role="alert">
        {{ refreshError() }}
        <button type="button" (click)="retryRefresh()" [disabled]="isRefreshing()">
          {{ isRefreshing() ? 'Henter…' : 'Prøv igen' }}
        </button>
      </p>
    }
    @if (isLoading()) {
      <app-page-loading label="Gør dit projekt klar…" layout="project" />
    } @else if (errorMessage()) {
      <p role="alert">{{ errorMessage() }}</p>
      <button type="button" (click)="retryProject()">Prøv igen</button>
    } @else if (project(); as data) {
      <!-- Hovedlayout -->
      <main class="project-layout" animate.enter="page-reveal">
        <!-- Venstre kolonne -->

        <app-offer-preview
          [data]="projectSidebar.getPreviewData(data)"
          [textSaveStates]="projectSidebar.fieldSaveStates()"
          (textEdited)="projectSidebar.editDraftText($event)"
          [hasPendingChanges]="
            projectSidebar.hasPendingChanges(data) || projectSidebar.pendingSaves() > 0
          "
          [isSavingChanges]="projectSidebar.pendingSaves() > 0"
          [openDetailsInitially]="newProjectId() === data.project.id"
          (detailsOpened)="onDetailsOpened()"
          (detailsSaved)="onDetailsSaved()"
          (offerFinalized)="onOfferFinalized()"
          (requestTab)="projectSidebar.selectTab($event)"
        />

        <!-- Højre kolonne -->
        <app-project-sidebar
          #projectSidebar
          [data]="data"
          (messageAdded)="refreshProject()"
          (aiCompleted)="onAiCompleted($event)"
        />
      </main>
    } @else {
      <main class="empty-workspace" animate.enter="page-reveal">
        <h1>Velkommen til Tak Makker</h1>

        <p>Vælg et eksisterende projekt ovenfor, eller opret et nyt projekt.</p>
      </main>
    }
  </div>
</div>
