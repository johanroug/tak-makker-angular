<header class="marketing-header">
  <app-public-brand [tagline]="false" />
  <nav aria-label="Hovednavigation">
    <a class="nav-secondary" routerLink="/" fragment="saadan">Sådan virker det</a
    ><a class="nav-secondary" routerLink="/" fragment="fag">Til dit fag</a
    >
    @if (!signedIn()) { <a routerLink="/login">Log ind</a> }
    <a class="marketing-button" [routerLink]="signedIn() ? '/projects' : '/register'"
      >{{ signedIn() ? 'Åbn arbejdsrum' : 'Prøv gratis' }} <span aria-hidden="true"><svg class="marketing-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M6 18 18 6M6 6h12v12" /></svg></span></a
    >
  </nav>
</header>
